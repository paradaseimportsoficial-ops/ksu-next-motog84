name: Moto G84 - KernelSU stock-config ABI diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bangkk-ksun-stock-abi.yml'

permissions:
  contents: read

concurrency:
  group: bangkk-ksun-stock-abi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      KERNEL_SHA: 9b862eda32365382ce5beebc8e616db1507eed1e
      KSU_SHA: b933b1f728116a456fbebf27b6a8772a640cdf23
      CLANG_SHA: 7e2d7f3e8dba20760df041bf90ca5a15913631c8
      LOCALVERSION: ''
      ARCH: arm64
      LLVM: '1'
      LLVM_IAS: '1'
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_COMPAT: arm-linux-gnueabi-
      CLANG_TRIPLE: aarch64-linux-gnu-
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            libncurses5 libncurses-dev python3 rsync curl xz-utils cpio kmod \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
          mkdir -p logs dist toolchain

      - name: Fetch pinned Motorola and KernelSU Next sources
        run: |
          git clone --depth 1 --branch MMI-V1TCS35H.88-16-1 \
            https://github.com/MotorolaMobilityLLC/kernel-msm.git kernel
          test "$(git -C kernel rev-parse HEAD)" = "$KERNEL_SHA"
          printf 'Motorola tag: MMI-V1TCS35H.88-16-1\nKernel: %s\nKernelSU Next legacy: %s\nClang repository: %s\n' \
            "$KERNEL_SHA" "$KSU_SHA" "$CLANG_SHA" > logs/sources.txt

      - name: Fetch Motorola built-in techpacks for bangkk
        run: |
          fetch_pack() {
            local directory="$1" repository="$2" revision="$3"
            git clone --depth 1 --branch MMI-V1TCS35H.88-16-1 \
              "https://github.com/MotorolaMobilityLLC/$repository.git" "kernel/techpack/$directory"
            test "$(git -C "kernel/techpack/$directory" rev-parse HEAD)" = "$revision"
            printf '%s %s\n' "$repository" "$revision" >> logs/sources.txt
          }
          fetch_pack display kernel-msm-5.4-techpack-display 760ad20d37ae0e7dc14dcab0aec76587804f4064
          fetch_pack video kernel-msm-5.4-techpack-video 07570bbeb5fa9f7874a2868681657fba9ed77bd9
          fetch_pack dataipa kernel-msm-techpack-dataipa 013bc7805c53e23e7585d2a594b15275c726ee29

      - name: Restore pinned Clang toolchain
        id: clang-cache
        uses: actions/cache/restore@v4
        with:
          path: toolchain/
          key: android-clang-r383902b1-${{ env.CLANG_SHA }}

      - name: Download original-generation Android Clang 11
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/$CLANG_SHA/clang-r383902b1.tar.gz" \
            --output clang.tar.gz
          sha256sum clang.tar.gz >> logs/sources.txt
          tar -xzf clang.tar.gz -C toolchain
          rm clang.tar.gz
      - name: Save pinned Clang toolchain
        if: steps.clang-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: toolchain/
          key: android-clang-r383902b1-${{ env.CLANG_SHA }}

      - name: Activate Clang
        run: |
          "$PWD/toolchain/bin/clang" --version | tee logs/compiler.txt
          echo "$PWD/toolchain/bin" >> "$GITHUB_PATH"

      - name: Integrate pinned KernelSU Next
        run: |
          git init kernel/KernelSU-Next
          git -C kernel/KernelSU-Next remote add origin https://github.com/KernelSU-Next/KernelSU-Next.git
          git -C kernel/KernelSU-Next fetch --depth 1 origin "$KSU_SHA"
          git -C kernel/KernelSU-Next checkout --detach FETCH_HEAD
          test "$(git -C kernel/KernelSU-Next rev-parse HEAD)" = "$KSU_SHA"
          git -C kernel/KernelSU-Next fetch --unshallow --tags origin
          cd kernel
          ln -s ../KernelSU-Next/kernel drivers/kernelsu
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          printf '\nsource "drivers/kernelsu/Kconfig"\n' >> drivers/Kconfig

      - name: Preserve stock seccomp ABI on this pinned 5.4 tree
        run: |
          python3 - <<'PY'
          import pathlib, re
          root = pathlib.Path('kernel')
          implementation = (root / 'kernel/seccomp.c').read_text()
          header = (root / 'include/linux/seccomp.h').read_text()
          if 'put_seccomp_filter' not in implementation or 'seccomp_filter_release' in implementation or 'filter_count' in header:
              raise SystemExit('Unexpected seccomp API; refusing this target-specific patch')
          makefile = (root / 'Makefile').read_text()
          if not re.search(r'^VERSION = 5$', makefile, re.M) or not re.search(r'^PATCHLEVEL = 4$', makefile, re.M):
              raise SystemExit('Only the pinned 5.4 target is supported')
          path = root / 'KernelSU-Next/kernel/Kbuild'
          text = path.read_text()
          start = text.index('ifneq ($(shell grep -q "atomic_t filter_count;"')
          end = text.index('\nendif', start) + len('\nendif')
          block = text[start:end]
          if block.count('$(shell sed -i') != 2 or 'patching struct seccomp' not in block:
              raise SystemExit('Unexpected Kbuild patch block')
          # app_profile.c uses put_seccomp_filter on this target, not filter_count.
          text = text[:start] + '# Moto 5.4: preserve original seccomp structure.\n' + text[end:]
          path.write_text(text)
          print('Removed unnecessary seccomp mutation for pinned Motorola 5.4')
          PY

      - name: Connect legacy boot and manager hooks for R7
        run: |
          python3 - <<'PY'
          import json, pathlib
          patches = json.loads("[{\"path\":\"kernel/reboot.c\",\"anchor\":\"SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,\",\"replacement\":\"#if defined(CONFIG_KSU) && defined(CONFIG_KSU_SYSCALL_TABLE_HOOK)\\nextern int ksu_handle_sys_reboot(int, int, unsigned int, void __user **);\\n#endif\\n\\nSYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,\"},{\"path\":\"kernel/reboot.c\",\"anchor\":\"\\t/* We only trust the superuser with rebooting the system. */\",\"replacement\":\"#if defined(CONFIG_KSU) && defined(CONFIG_KSU_SYSCALL_TABLE_HOOK)\\n\\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\\n#endif\\n\\n\\t/* We only trust the superuser with rebooting the system. */\"},{\"path\":\"fs/exec.c\",\"anchor\":\"static int __do_execve_file(int fd, struct filename *filename,\",\"replacement\":\"#if defined(CONFIG_KSU) && defined(CONFIG_KSU_SYSCALL_TABLE_HOOK)\\nextern int ksu_handle_execveat_ksud(int *, struct filename **,\\n\\tstruct user_arg_ptr *, struct user_arg_ptr *, int *);\\n#endif\\n\\nstatic int __do_execve_file(int fd, struct filename *filename,\"},{\"path\":\"fs/exec.c\",\"anchor\":\"\\tif (IS_ERR(filename))\\n\\t\\treturn PTR_ERR(filename);\\n\\n\\t/*\\n\\t * We move\",\"replacement\":\"#if defined(CONFIG_KSU) && defined(CONFIG_KSU_SYSCALL_TABLE_HOOK)\\n\\tif (!IS_ERR_OR_NULL(filename))\\n\\t\\tksu_handle_execveat_ksud(&fd, &filename, &argv, &envp, &flags);\\n#endif\\n\\n\\tif (IS_ERR(filename))\\n\\t\\treturn PTR_ERR(filename);\\n\\n\\t/*\\n\\t * We move\"},{\"path\":\"fs/read_write.c\",\"anchor\":\"SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)\\n{\\n\\treturn ksys_read(fd, buf, count);\\n}\",\"replacement\":\"#if defined(CONFIG_KSU) && defined(CONFIG_KSU_SYSCALL_TABLE_HOOK)\\nextern void ksu_handle_sys_read(unsigned int);\\n#endif\\n\\nSYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)\\n{\\n#if defined(CONFIG_KSU) && defined(CONFIG_KSU_SYSCALL_TABLE_HOOK)\\n\\tksu_handle_sys_read(fd);\\n#endif\\n\\treturn ksys_read(fd, buf, count);\\n}\"},{\"path\":\"fs/stat.c\",\"anchor\":\"SYSCALL_DEFINE2(newfstat, unsigned int, fd, struct stat __user *, statbuf)\",\"replacement\":\"#if defined(CONFIG_KSU) && defined(CONFIG_KSU_SYSCALL_TABLE_HOOK)\\nextern void ksu_handle_newfstat_ret(unsigned int *, struct stat __user **);\\n#endif\\n\\nSYSCALL_DEFINE2(newfstat, unsigned int, fd, struct stat __user *, statbuf)\"},{\"path\":\"fs/stat.c\",\"anchor\":\"SYSCALL_DEFINE2(newfstat, unsigned int, fd, struct stat __user *, statbuf)\\n{\\n\\tstruct kstat stat;\\n\\tint error = vfs_fstat(fd, &stat);\\n\\n\\tif (!error)\\n\\t\\terror = cp_new_stat(&stat, statbuf);\\n\\n\\treturn error;\\n}\",\"replacement\":\"SYSCALL_DEFINE2(newfstat, unsigned int, fd, struct stat __user *, statbuf)\\n{\\n\\tstruct kstat stat;\\n\\tint error = vfs_fstat(fd, &stat);\\n\\n\\tif (!error)\\n\\t\\terror = cp_new_stat(&stat, statbuf);\\n\\n#if defined(CONFIG_KSU) && defined(CONFIG_KSU_SYSCALL_TABLE_HOOK)\\n\\tif (!error)\\n\\t\\tksu_handle_newfstat_ret(&fd, &statbuf);\\n#endif\\n\\treturn error;\\n}\"},{\"path\":\"fs/stat.c\",\"anchor\":\"SYSCALL_DEFINE2(fstat64, unsigned long, fd, struct stat64 __user *, statbuf)\",\"replacement\":\"#if defined(CONFIG_KSU) && defined(CONFIG_KSU_SYSCALL_TABLE_HOOK)\\nextern void ksu_handle_fstat64_ret(unsigned long *, struct stat64 __user **);\\n#endif\\n\\nSYSCALL_DEFINE2(fstat64, unsigned long, fd, struct stat64 __user *, statbuf)\"},{\"path\":\"fs/stat.c\",\"anchor\":\"SYSCALL_DEFINE2(fstat64, unsigned long, fd, struct stat64 __user *, statbuf)\\n{\\n\\tstruct kstat stat;\\n\\tint error = vfs_fstat(fd, &stat);\\n\\n\\tif (!error)\\n\\t\\terror = cp_new_stat64(&stat, statbuf);\\n\\n\\treturn error;\\n}\",\"replacement\":\"SYSCALL_DEFINE2(fstat64, unsigned long, fd, struct stat64 __user *, statbuf)\\n{\\n\\tstruct kstat stat;\\n\\tint error = vfs_fstat(fd, &stat);\\n\\n\\tif (!error)\\n\\t\\terror = cp_new_stat64(&stat, statbuf);\\n\\n#if defined(CONFIG_KSU) && defined(CONFIG_KSU_SYSCALL_TABLE_HOOK)\\n\\tif (!error)\\n\\t\\tksu_handle_fstat64_ret(&fd, &statbuf);\\n#endif\\n\\treturn error;\\n}\"},{\"path\":\"drivers/input/input.c\",\"anchor\":\"static void input_handle_event(struct input_dev *dev,\",\"replacement\":\"#if defined(CONFIG_KSU) && defined(CONFIG_KSU_SYSCALL_TABLE_HOOK)\\nextern int ksu_handle_input_handle_event(unsigned int *, unsigned int *, int *);\\n#endif\\n\\nstatic void input_handle_event(struct input_dev *dev,\"},{\"path\":\"drivers/input/input.c\",\"anchor\":\"\\tint disposition = input_get_disposition(dev, type, code, &value);\",\"replacement\":\"\\tint disposition;\\n#if defined(CONFIG_KSU) && defined(CONFIG_KSU_SYSCALL_TABLE_HOOK)\\n\\tksu_handle_input_handle_event(&type, &code, &value);\\n#endif\\n\\tdisposition = input_get_disposition(dev, type, code, &value);\"}]")
          for patch in patches:
              path = pathlib.Path('kernel') / patch['path']
              text = path.read_text()
              if text.count(patch['anchor']) != 1:
                  raise SystemExit('Unexpected source at ' + patch['path'])
              path.write_text(text.replace(patch['anchor'], patch['replacement'], 1))
          print('Installed guarded reboot, exec-init, read, fstat and safe-mode input hooks')
          PY

      - name: Configure original boot settings plus KernelSU
        run: |
          cd kernel
          mkdir -p out
          cp ../diagnostics/stock-88-16-1.config out/.config
          scripts/config --file out/.config -e KSU -d KSU_MANUAL_HOOK -d KSU_KPROBES_HOOK -e KSU_SYSCALL_TABLE_HOOK
          scripts/config --file out/.config --set-str LOCALVERSION '-Tecnico-Root-V1' -d LOCALVERSION_AUTO
          make O=out olddefconfig 2>&1 | tee ../logs/config.log
          cp out/.config ../logs/kernel.config
          diff -u ../diagnostics/stock-88-16-1.config out/.config > ../logs/config-diff.txt || test "$?" = 1
          grep -qx 'CONFIG_KSU=y' out/.config
          grep -qx 'CONFIG_KSU_SYSCALL_TABLE_HOOK=y' out/.config
          make -s O=out kernelrelease | tee ../logs/kernelrelease.txt
          grep -qx '5.4.284-Tecnico-Root-V1' ../logs/kernelrelease.txt

      - name: Prepare SELinux headers and check KernelSU
        run: |
          cd kernel
          make O=out headers_install 2>&1 | tee ../logs/headers.log
          make -j2 O=out security/selinux/ 2>&1 | tee ../logs/selinux-build.log
          make -j2 O=out drivers/kernelsu/ 2>&1 | tee ../logs/ksun-build.log

      - name: Compile Motorola kernel with KernelSU
        run: |
          cd kernel
          make -j2 O=out Image modules 2>&1 | tee ../logs/kernel-build.log
          test -s out/Module.symvers
          cp out/Module.symvers ../logs/
          git diff --binary > ../logs/kernel-integration.patch
          git diff --exit-code -- include/linux/seccomp.h
          git -C KernelSU-Next diff --binary > ../logs/ksun-compatibility.patch
          cp include/linux/seccomp.h ../logs/seccomp.h
          cp out/arch/arm64/boot/Image ../logs/Image
          llvm-nm out/vmlinux | grep ' ksu_' > ../logs/ksu-symbols.txt
          cp ../diagnostics/vendor-88-16-1-crcs.json ../logs/vendor-reference.json

      - name: Compare per-module CRCs
        run: |
          python3 - <<'PY'
          import json, pathlib
          symbols = {p[1]: int(p[0], 16) for line in pathlib.Path('logs/Module.symvers').read_text().splitlines() if (p := line.split())}
          reference = json.loads(pathlib.Path('diagnostics/vendor-88-16-1-crcs.json').read_text())
          # Exports read from SHN_ABS __crc_* in the supplied mmi_annotate.ko.
          # That provider must match the kernel before its exports can be used.
          provider = reference['modules']['lib/modules/mmi_annotate.ko']
          if any(symbols.get(name) != crc for name, crc in provider.items()):
              raise SystemExit('mmi_annotate provider is not compatible with the kernel')
          module_exports = {'mmi_annotate': 0xf3cb0240, 'mmi_annotate_persist': 0x5482805e}
          for name, crc in module_exports.items():
              if name in symbols and symbols[name] != crc:
                  raise SystemExit('Conflicting export: ' + name)
              symbols[name] = crc
          report = {}
          for module, expected in reference['modules'].items():
              report[module] = {
                  'matches': sum(symbols.get(name) == crc for name, crc in expected.items()),
                  'mismatches': {name: {'expected': hex(crc), 'built': hex(symbols[name])} for name, crc in expected.items() if name in symbols and symbols[name] != crc},
                  'missing': [name for name in expected if name not in symbols],
              }
          pathlib.Path('logs/abi-report.json').write_text(json.dumps(report, indent=2))
          summary = ['# KernelSU with original boot configuration ABI diagnostic', '', 'Reference only: no boot or flash package generated. GKI-path modules and Motorola modules are reported separately; loading relevance must be checked.', '']
          for label, subset in [('GKI-path', [n for n in report if '/5.4-gki/' in n]), ('Motorola', [n for n in report if '/5.4-gki/' not in n])]:
              affected = sum(bool(report[n]['mismatches']) for n in subset)
              summary.append(f'{label}: {affected}/{len(subset)} modules have differing CRCs.')
          text = '\n'.join(summary) + '\n'
          pathlib.Path('logs/summary.md').write_text(text)
          print(text)
          PY
          cat logs/summary.md >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import json, pathlib
          report = json.loads(pathlib.Path('logs/abi-report.json').read_text())
          motorola = {name: data for name, data in report.items() if '/5.4-gki/' not in name}
          assert len(motorola) == 3, 'Unexpected Motorola module inventory'
          bad = [name for name, data in motorola.items() if data['mismatches'] or data['missing']]
          if bad:
              raise SystemExit('Motorola module ABI check failed: ' + ', '.join(bad))
          print('All required CRCs for the three supplied Motorola modules match.')
          PY

      - name: Verify built-in stock drivers and hash build outputs
        run: |
          cd logs
          python3 - <<'PY'
          from pathlib import Path
          image = Path("Image").read_bytes()
          probes = ["techpack/display/msm/dsi/dsi_panel.c", "techpack/video/msm/vidc/msm_v4l2_vidc.c", "techpack/dataipa/drivers/platform/msm/gsi/gsi.c"]
          for probe in probes:
              if probe.encode() not in image:
                  raise SystemExit(f"Stock driver marker missing from Image: {probe}")
          PY
          sha256sum Image Module.symvers kernel.config sources.txt kernelrelease.txt > SHA256SUMS

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bangkk-ksun-stock-abi-${{ github.run_number }}
          path: logs/
          retention-days: 14
