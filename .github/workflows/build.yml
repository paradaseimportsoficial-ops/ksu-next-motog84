name: Build KernelSU Next - Moto G84

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev git zip llvm clang libelf-dev curl

      - name: Clone Motorola Kernel Source
        run: |
          git clone --depth=1 https://github.com/MotorolaMobilityLLC/kernel-msm.git kernel_src

      - name: Setup KernelSU Next Driver
        run: |
          cd kernel_src
          mkdir -p drivers/kernelsu
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git KSU_TEMP
          cp -r KSU_TEMP/kernel/* drivers/kernelsu/
          rm -rf KSU_TEMP
          grep -q "kernelsu" drivers/Makefile || echo "obj-y += kernelsu/" >> drivers/Makefile
          grep -q "kernelsu" drivers/Kconfig || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

      - name: Auto-Detect Defconfig & Build Kernel
        run: |
          cd kernel_src
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Tenta encontrar a defconfig oficial terminada em _defconfig
          DEFCONFIG_FILE=$(find arch/arm64/configs -name "*defconfig" | grep -E "holi|sm6375|bangkk|gki" | head -n 1 | sed 's|arch/arm64/configs/||')
          
          if [ -n "$DEFCONFIG_FILE" ]; then
            echo "Usando defconfig: $DEFCONFIG_FILE"
            make O=out $DEFCONFIG_FILE
          else
            echo "Usando gki_defconfig padrao"
            make O=out gki_defconfig || make O=out defconfig
          fi
          
          # Habilita o KernelSU
          echo "CONFIG_KSU=y" >> out/.config
          make O=out olddefconfig
          
          # Compila o Kernel
          make -j$(nproc) O=out

      - name: Upload boot.img Artifact
        uses: actions/upload-artifact@v3
        with:
          name: MotoG84-KernelSU-Next
          path: kernel_src/out/arch/arm64/boot/boot.img
