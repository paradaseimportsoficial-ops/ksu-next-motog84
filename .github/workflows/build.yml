name: Build KernelSU Next LKM Auto-Load para Moto G84 5G (Android 15)

on:
  workflow_dispatch:

jobs:
  build-lkm:
    runs-on: ubuntu-22.04
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente de compilação
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev python3-pip lz4 pigz git ccache libncurses5-dev lld clang gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi
          pip3 install gdown

      - name: Baixar fonte do Kernel oficial da Motorola
        run: |
          git clone https://github.com/MotorolaMobilityLLC/kernel-msm.git --depth=1 android-kernel

      - name: Baixar KernelSU-Next Standalone
        run: |
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git -b next ksu-src

      - name: Preparar Headers do Kernel
        run: |
          cd android-kernel
          touch .scmversion
          
          # Configura a defconfig do Moto G84
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- vendor/bangkk_defconfig || make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          
          # Habilita módulos no .config
          scripts/config --file out/.config --enable CONFIG_MODULES
          scripts/config --file out/.config --enable CONFIG_MODULE_UNLOAD
          scripts/config --file out/.config --set-str CONFIG_LOCALVERSION "-moto-17290-g91c2dab5855a"
          
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          
          # Prepara os cabeçalhos sem exigir o vmlinux
          make -j$(nproc --all) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- KCFLAGS="-w" WERROR=0 modules_prepare

      - name: Compilar Módulo ksu.ko Autônomo (LKM)
        run: |
          cd ksu-src/kernel
          
          # Compila o módulo externo direcionando para a árvore de saída do kernel (KDIR)
          make -j$(nproc --all) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KDIR=../../android-kernel/out KCFLAGS="-w" WERROR=0 || make -j$(nproc --all) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KDIR=../../android-kernel KCFLAGS="-w" WERROR=0
          
          cd ../..
          # Procura o ksu.ko gerado
          KSU_PATH=$(find ksu-src/ -name "ksu.ko" | head -n 1)
          
          if [ -n "$KSU_PATH" ]; then
              cp "$KSU_PATH" ./ksu.ko
              echo "Módulo ksu.ko compilado com Sucesso!"
          else
              echo "ERRO: Falha ao compilar ksu.ko!"
              exit 1
          fi

      - name: Injetar Chamada no Init e Reempacotar boot.img
        run: |
          mkdir -p work
          cd work

          # 1. Baixar o boot.img Stock da ROM Android 15
          gdown "https://drive.google.com/uc?id=1rJ1xb5ZgOAYiMTMa86LzMSpRUk44-D5_" -O boot_stock.img

          # 2. Baixar magiskboot
          curl -L -o magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v26.1/Magisk-v26.1.apk
          unzip -q magisk.apk
          cp lib/x86_64/libmagiskboot.so ./magiskboot
          chmod +x magiskboot

          # 3. Descompactar boot.img e ramdisk
          ./magiskboot unpack boot_stock.img
          ./magiskboot cpio ramdisk.cpio extract

          # 4. Criar a pasta e copiar o ksu.ko para a ramdisk
          mkdir -p lib/modules
          cp ../ksu.ko ./lib/modules/ksu.ko

          # 5. Injetar o comando insmod no arquivo init.rc
          if [ -f init.rc ]; then
              echo "" >> init.rc
              echo "on early-init" >> init.rc
              echo "    insmod /lib/modules/ksu.ko" >> init.rc
          fi

          # 6. Reconstruir a ramdisk e reempacotar
          ./magiskboot cpio ramdisk.cpio "add 0755 lib/modules/ksu.ko ./lib/modules/ksu.ko"
          ./magiskboot cpio ramdisk.cpio "patch"
          ./magiskboot repack boot_stock.img boot_finished.img
          cp boot_finished.img ../boot_finished.img

      - name: Anexar Artefato Final (Boot Image LKM)
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU_Next_LKM_Active_Moto_G84
          path: boot_finished.img
          
