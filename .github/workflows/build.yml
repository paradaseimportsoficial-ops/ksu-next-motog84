name: Build Moto G84 5G KernelSU Next Zip

on:
  workflow_dispatch:
    inputs:
      boot_url:
        description: 'Link do boot.img (Google Drive)'
        required: true
        default: 'https://drive.google.com/file/d/15WZxW59o_014c0T5u1_srezZ-5mHQOY5/view?usp=drivesdk'
      vendor_boot_url:
        description: 'Link do vendor_boot.img (Google Drive)'
        required: true
        default: 'https://drive.google.com/file/d/1aKIDbTiGpqye6hF1AgObPmwRV5ufmoAQ/view?usp=drivesdk'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Liberar Espaço em Disco (Limpeza Avançada)
        run: |
          echo "Espaço livre inicial:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get purge -y azure-cli google-cloud-sdk hhvm google-chrome-stable firefox powershell mono-devel mysql-client libmysqlclient-dev libmagickcore-dev libmagickwand-dev imagemagick
          sudo apt-get autoremove -y
          sudo apt-get clean
          echo "Espaço livre após a limpeza:"
          df -h

      - name: Instalar dependências e ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zlib1g-dev python3-pip wget zip unzip
          pip install --upgrade pip
          pip install gdown

      - name: Baixar boot.img e vendor_boot do Google Drive
        run: |
          echo "Baixando boot.img..."
          gdown "${{ github.event.inputs.boot_url }}" -O boot.img
          echo "Baixando vendor_boot.img..."
          gdown "${{ github.event.inputs.vendor_boot_url }}" -O vendor_boot.img
          ls -lh *.img

      - name: Preparar ambiente AnyKernel3 e Magiskboot
        run: |
          git clone https://github.com/Kernel-SU/AnyKernel3 -b master anykernel
          wget https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk -O magisk.zip
          unzip -q magisk.zip 'lib/arm64-v8a/libmagiskboot.so'
          mv lib/arm64-v8a/libmagiskboot.so ./magiskboot
          chmod +x ./magiskboot

      - name: Processar e Integrar KernelSU Next
        run: |
          ./magiskboot unpack boot.img
          
          # Injeção automática do KernelSU Next na estrutura extraída
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next || true
          
          # Copia os arquivos atualizados para o AnyKernel3
          cp boot.img anykernel/
          cp vendor_boot.img anykernel/
          
          cd anykernel
          chmod +x ak3-core.sh tools/* 2>/dev/null || true

      - name: Compactar pacote final .ZIP
        run: |
          cd anykernel
          zip -r ../MotoG84_KernelSUNext_Flashable.zip *
          cd ..
          ls -lh MotoG84_KernelSUNext_Flashable.zip

      - name: Enviar artefato do ZIP compilado
        uses: actions/upload-artifact@v4
        with:
          name: MotoG84_KernelSU_Next_Flashable_Zip
          path: MotoG84_KernelSUNext_Flashable.zip
          
