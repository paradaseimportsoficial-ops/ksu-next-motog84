name: Compilar Moto G84 5G KernelSU Next Zip

on:
  workflow_dispatch:
    inputs:
      boot_url:
        description: 'Link do boot.img (Google Drive)'
        required: true
        default: 'https://drive.google.com/file/d/15WZxW59o_014c0T5u1_srezZ-5mHQOY5/view?usp=drivesdk'
      vendor_boot_url:
        description: 'Link do vendor_boot.img (Google Drive)'
        required: true
        default: 'https://drive.google.com/file/d/1aKIDbTiGpqye6hF1AgObPmwRV5ufmoAQ/view?usp=drivesdk'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar ferramentas básicas
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget zip unzip python3-pip
          pip3 install --upgrade pip
          pip3 install gdown

      - name: Baixar boot.img e vendor_boot do Google Drive
        run: |
          echo "Baixando boot.img..."
          gdown "${{ github.event.inputs.boot_url }}" -O boot.img
          echo "Baixando vendor_boot.img..."
          gdown "${{ github.event.inputs.vendor_boot_url }}" -O vendor_boot.img
          ls -lh *.img

      - name: Preparar AnyKernel3 e Magiskboot correto (Linux x86_64)
        run: |
          git clone https://github.com/Kernel-SU/AnyKernel3 -b master anykernel
          
          # Baixa o Magisk oficial completo para extrair o magiskboot de Linux correto
          wget https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk -O magisk.zip
          unzip -q magisk.zip
          
          # Copia o magiskboot nativo para Linux x86_64 que vem dentro do APK
          mv lib/x86_64/libmagiskboot.so ./magiskboot
          chmod +x ./magiskboot
          ./magiskboot -h || true

      - name: Processar e Integrar KernelSU Next
        run: |
          ./magiskboot unpack boot.img
          
          # Injeção automática do KernelSU Next
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next || true
          
          # Organiza os arquivos para o AnyKernel3
          cp boot.img anykernel/
          cp vendor_boot.img anykernel/

      - name: Compactar pacote final .ZIP
        run: |
          cd anykernel
          zip -r ../MotoG84_KernelSUNext_Flashable.zip *
          cd ..
          ls -lh MotoG84_KernelSUNext_Flashable.zip

      - name: Enviar artefato do ZIP compilado
        uses: actions/upload-artifact@v4
        with:
          name: MotoG84_KernelSUNext_Flashable_Zip
          path: MotoG84_KernelSUNext_Flashable.zip
          
