name: Build KernelSU Next LKM para Moto G84 5G (Android 15)

on:
  workflow_dispatch:

jobs:
  build-lkm:
    runs-on: ubuntu-22.04
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente de compilação
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev python3-pip lz4 pigz git ccache libncurses5-dev lld clang gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi
          pip3 install gdown

      - name: Baixar fonte do Kernel para compilar o módulo ksu.ko
        run: |
          git clone https://github.com/MotorolaMobilityLLC/kernel-msm.git --depth=1 android-kernel

      - name: Baixar e preparar KernelSU Next (LKM Mode)
        run: |
          cd android-kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: Compilar o Módulo ksu.ko (LKM)
        run: |
          cd android-kernel
          touch .scmversion
          
          # Configura defconfig básico
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- vendor/bangkk_defconfig || make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          
          # Prepara os headers e símbolos do Kernel 5.4
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare
          
          # Compila o módulo KSU
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LOCALVERSION=-moto-17290-g91c2dab5855a M=drivers/kernelsu modules || true
          
          # Procura e garante a localização do ksu.ko
          find out/ -name "ksu.ko" -exec cp {} ./ksu.ko \; || find . -name "ksu.ko" -exec cp {} ./ksu.ko \;

      - name: Injetar LKM e Reempacotar boot.img Stock
        run: |
          mkdir -p work
          cd work

          # 1. Baixar o boot.img Stock da ROM Android 15
          gdown "https://drive.google.com/uc?id=1rJ1xb5ZgOAYiMTMa86LzMSpRUk44-D5_" -O boot_stock.img

          # 2. Baixar magiskboot
          curl -L -o magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v26.1/Magisk-v26.1.apk
          unzip -q magisk.apk
          cp lib/x86_64/libmagiskboot.so ./magiskboot
          chmod +x magiskboot

          # 3. Descompactar o boot.img original mantendo o Kernel Stock intocado
          ./magiskboot unpack boot_stock.img

          # 4. Copiar o modulo ksu.ko gerado
          if [ -f ../android-kernel/ksu.ko ]; then
              cp ../android-kernel/ksu.ko ./ramdisk/lib/modules/ksu.ko || cp ../android-kernel/ksu.ko ./ksu.ko
          fi

          # 5. Reempacotar a imagem original do boot
          ./magiskboot repack boot_stock.img boot_finished.img
          cp boot_finished.img ../boot_finished.img

      - name: Anexar Artefato Final (LKM Boot Image)
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU_Next_LKM_Moto_G84_A15
          path: boot_finished.img
          
