name: Build KernelSU Next + SUSFS para Moto G84 5G (Android 15)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente e ferramentas de compilação
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev python3-pip lz4 pigz git ccache libncurses5-dev lld clang gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi
          pip3 install gdown

      - name: Baixar código-fonte do Kernel oficial da Motorola (Moto G84)
        run: |
          git clone https://github.com/MotorolaMobilityLLC/kernel-msm.git --depth=1 android-kernel

      - name: Integrar KernelSU Next e SUSFS no código-fonte
        run: |
          cd android-kernel
          # Integrar KernelSU Next
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
          
          # Integrar SUSFS (Aplicando o patch correspondente ao kernel 5.4)
          # Baixa os arquivos do susfs para o diretório fs/susfs
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android14-5.4 susfs_tmp || git clone https://gitlab.com/simonpunk/susfs4ksu.git susfs_tmp
          cp -r susfs_tmp/kernel_patches/fs/* fs/
          cp -r susfs_tmp/kernel_patches/include/linux/* include/linux/
          
          # Aplica os patches de cabeçalho do SUSFS se houver script de patch
          if [ -f susfs_tmp/kernel_patches/50_add_susfs_in_gki-android14-5.4.patch ]; then
              patch -p1 < susfs_tmp/kernel_patches/50_add_susfs_in_gki-android14-5.4.patch || true
          fi
          rm -rf susfs_tmp

      - name: Configurar Swap de 12GB para evitar falta de memória
        run: |
          sudo swapoff /swapfile || true
          sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Compilar Kernel do Moto G84 5G com Suporte a SUSFS
        run: |
          cd android-kernel
          
          # Remove o sufixo -dirty do Git
          touch .scmversion
          
          # Desativa erros estritos no GCC do Host
          export HOSTCFLAGS="-Wno-error=strict-prototypes -Wno-error=implicit-int -Wno-error=implicit-function-declaration -Wno-error=return-type"
          
          # Configuração do Defconfig
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- vendor/bangkk_defconfig || make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- vendor/penangf_defconfig || make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- defconfig
          
          # Habilitar flags necessárias para QCOM SCM e SUSFS no .config
          scripts/config --file out/.config --enable CONFIG_QCOM_SCM
          scripts/config --file out/.config --enable CONFIG_QCOM_SCM_DOWNLOAD_MODE
          scripts/config --file out/.config --enable CONFIG_KSU
          scripts/config --file out/.config --enable CONFIG_KSU_SUSFS
          
          # Atualiza a configuração
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          
          # Compilação da imagem crua (Image) otimizada
          make -j$(nproc --all) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- LOCALVERSION= WERROR=0 KCFLAGS="-w" Image

      - name: Processar e Reempacotar com Magiskboot para Android 15
        run: |
          mkdir -p work
          cd work

          # 1. Baixar o boot.img do Android 15 do Google Drive
          gdown "https://drive.google.com/uc?id=1rJ1xb5ZgOAYiMTMa86LzMSpRUk44-D5_" -O boot_stock.img

          # 2. Extrair magiskboot do APK do Magisk
          curl -L -o magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v26.1/Magisk-v26.1.apk
          unzip -q magisk.apk
          cp lib/x86_64/libmagiskboot.so ./magiskboot
          chmod +x magiskboot

          # 3. Descompactar o boot.img original do Android 15 (preservando ramdisk e bootconfig)
          ./magiskboot unpack boot_stock.img

          # 4. Substituir estritamente o arquivo de kernel binário pelo Image compilado do zero
          cp ../android-kernel/out/arch/arm64/boot/Image kernel

          # 5. Reempacotar preservando os headers exatos do Android 15
          ./magiskboot repack boot_stock.img boot_finished.img
          cp boot_finished.img ../boot_finished.img

      - name: Anexar Artefato (boot.img Final Compilado - Android 15 com SUSFS)
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU_Next_SUSFS_Moto_G84_Android15
          path: boot_finished.img
          
