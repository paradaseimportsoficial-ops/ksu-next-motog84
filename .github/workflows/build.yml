name: Compilar Kernel e Injetar APatch no Moto G84

on:
  workflow_dispatch:
    inputs:
      superkey:
        description: 'SuperKey do APatch (mínimo 8 caracteres)'
        required: true
        default: 'suasenha123'
        type: string

jobs:
  build-and-apatch:
    runs-on: ubuntu-22.04
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev python3-pip lz4 pigz git ccache libncurses5-dev lld clang gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi curl cpio jq

      - name: Baixar Fonte do Kernel da Motorola (bangkk)
        run: |
          git clone https://github.com/MotorolaMobilityLLC/kernel-msm.git --depth=1 android-kernel

      - name: Configurar Versão e Dependências do Kernel
        run: |
          cd android-kernel
          touch .scmversion
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- vendor/bangkk_defconfig || make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          scripts/config --file out/.config --set-str CONFIG_LOCALVERSION "-tecnico-root-v1"
          scripts/config --file out/.config --enable CONFIG_QCOM_SCM
          scripts/config --file out/.config --enable CONFIG_POWER_RESET_MSM
          scripts/config --file out/.config --enable CONFIG_QCOM_PON
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Compilar a Imagem do Kernel
        run: |
          cd android-kernel
          export HOSTCFLAGS="-Wno-error=strict-prototypes -Wno-error=implicit-int -Wno-error=implicit-function-declaration -Wno-error=return-type"
          make -j$(nproc --all) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- KCFLAGS="-w" WERROR=0 Image.gz-dtb || make -j$(nproc --all) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- KCFLAGS="-w" WERROR=0 Image.gz

      - name: Baixar boot.img e Aplicar Patch do APatch
        run: |
          # 1. Baixa o boot.img do Google Drive
          FILE_ID="15WZxW59o_014c0T5u1_srezZ-5mHQOY5"
          curl -sc ./cookie "https://drive.google.com/uc?export=download&id=${FILE_ID}" > /dev/null
          CODE="$(awk '/_warning_/ {print $NF}' ./cookie)"
          curl -Lb ./cookie "https://drive.google.com/uc?export=download&confirm=${CODE}&id=${FILE_ID}" -o boot.img
          
          # 2. Baixa a versão mais recente do kptools e kpimg via API do GitHub
          KPTOOLS_URL=$(curl -s https://api.github.com/repos/bmax121/APatch/releases/latest | jq -r '.assets[] | select(.name | contains("kptools-linux")) | .browser_download_url' | head -n 1)
          KPIMG_URL=$(curl -s https://api.github.com/repos/bmax121/APatch/releases/latest | jq -r '.assets[] | select(.name | contains("kpimg-android")) | .browser_download_url' | head -n 1)

          curl -L -o kptools "$KPTOOLS_URL"
          curl -L -o kpimg "$KPIMG_URL"
          chmod +x kptools

          # 3. Baixa o magiskboot para desempacotar a imagem
          curl -L -o magiskboot https://github.com/vvb2060/magiskboot_for_ndk/releases/download/v26.1/magiskboot
          chmod +x magiskboot
          
          mkdir boot_unpack && cd boot_unpack
          ../magiskboot unpack ../boot.img
          cd ..

          # 4. Copia o kernel compilado para dentro da pasta de unpack
          KERNEL_IMG=$(find android-kernel/out/arch/arm64/boot/ -name "Image.gz-dtb" -o -name "Image.gz" | head -n 1)
          cp "$KERNEL_IMG" boot_unpack/kernel

          # 5. Aplica o patch do APatch no kernel customizado
          ./kptools -p --image boot_unpack/kernel --skey "${{ github.event.inputs.superkey }}" --kpimg kpimg --out boot_unpack/kernel-patched

          # Substitui o kernel original pelo kernel com APatch aplicado
          mv boot_unpack/kernel-patched boot_unpack/kernel

          # 6. Reempacota o boot.img final
          cd boot_unpack
          ../magiskboot repack ../boot.img
          cd ..

          if [ -f "boot_unpack/new-boot.img" ]; then
              cp boot_unpack/new-boot.img MotoG84_APatch_TeccnicoRoot.img
          else
              echo "ERRO ao gerar o boot final!"
              exit 1
          fi

      - name: Enviar Arquivo Boot Final como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: MotoG84_APatch_Boot_IMG
          path: MotoG84_APatch_TeccnicoRoot.img
          
