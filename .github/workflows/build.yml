name: Build KernelSU Next - Moto G84

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev git zip llvm clang libelf-dev curl gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 python3-pip
          pip3 install mkbootimg --break-system-packages || true

      - name: Setup Android Clang Toolchain (AOSP)
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+/refs/heads/main/clang-r416183b clang || git clone --depth=1 https://github.com/llvm/llvm-project.git -b release/12.x clang-llvm
          if [ -d "clang/bin" ]; then
            echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH
          fi

      - name: Clone Motorola Kernel Source
        run: |
          git clone --depth=1 https://github.com/MotorolaMobilityLLC/kernel-msm.git kernel_src

      - name: Setup KernelSU Next Driver
        run: |
          cd kernel_src
          mkdir -p drivers/kernelsu
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git KSU_TEMP
          cp -r KSU_TEMP/kernel/* drivers/kernelsu/
          rm -rf KSU_TEMP
          grep -q "kernelsu" drivers/Makefile || echo "obj-y += kernelsu/" >> drivers/Makefile
          grep -q "kernelsu" drivers/Kconfig || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

      - name: Build Kernel Image
        run: |
          cd kernel_src
          mkdir -p out
          
          # Aplicar definicoes do vendor holi/bangkk
          if [ -f "arch/arm64/configs/vendor/holi-perf_defconfig" ]; then
            ARCH=arm64 ./scripts/kconfig/merge_config.sh -O out arch/arm64/configs/vendor/holi-perf_defconfig arch/arm64/configs/vendor/bangkk.config || true
          else
            make O=out ARCH=arm64 gki_defconfig || make O=out ARCH=arm64 defconfig
          fi
          
          # Habilitar KernelSU Next
          echo "CONFIG_KSU=y" >> out/.config
          
          # Compilar
          make -j$(nproc) O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          make -j$(nproc) O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- Image.gz || make -j$(nproc) O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- Image

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MotoG84-KernelSU-Next-Kernel
          path: |
            kernel_src/out/arch/arm64/boot/Image.gz
            kernel_src/out/arch/arm64/boot/Image
