name: Build KernelSU Next (Legacy 5.4 Fix) - Moto G84

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev git zip llvm clang libelf-dev curl wget gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 python3-pip

      - name: Clone Motorola Kernel Source
        run: |
          git clone --depth=1 https://github.com/MotorolaMobilityLLC/kernel-msm.git kernel_src

      - name: Setup KernelSU Next Driver
        run: |
          cd kernel_src
          rm -rf drivers/kernelsu
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git drivers/kernelsu
          rm -rf drivers/kernelsu/.git

          if [ -d "drivers/kernelsu/kernel" ]; then
            cp -r drivers/kernelsu/kernel/* drivers/kernelsu/
          fi

          grep -q "drivers/kernelsu" drivers/Kconfig || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          grep -q "drivers/kernelsu" drivers/Makefile || echo 'obj-y += kernelsu/' >> drivers/Makefile

      - name: Apply Manual Hooks (Legacy Kernel Patch)
        run: |
          python3 -c '
          # Injeção em fs/exec.c
          with open("kernel_src/fs/exec.c", "r") as f:
              content = f.read()
          if "ksu_handle_execve" not in content:
              target = "setup_new_exec(bprm);"
              patch = "setup_new_exec(bprm);\n\t{\n\t\textern int ksu_handle_execve(struct filename **filename_ptr);\n\t\tksu_handle_execve(&bprm->filename);\n\t}"
              content = content.replace(target, patch, 1)
              with open("kernel_src/fs/exec.c", "w") as f:
                  f.write(content)

          # Injeção em fs/open.c
          with open("kernel_src/fs/open.c", "r") as f:
              content = f.read()
          if "ksu_handle_faccessat" not in content:
              target = "SYSCALL_DEFINE3(faccessat,"
              patch = "extern int ksu_handle_faccessat(int *dfd, const char __user **filename_ptr, int *mode, int *flags);\nSYSCALL_DEFINE3(faccessat,"
              content = content.replace(target, patch, 1)
              target2 = "return do_faccessat(dfd, filename, mode);"
              patch2 = "ksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n\treturn do_faccessat(dfd, filename, mode);"
              content = content.replace(target2, patch2, 1)
              with open("kernel_src/fs/open.c", "w") as f:
                  f.write(content)
          '

      - name: Build Kernel Image & DTB
        run: |
          cd kernel_src
          mkdir -p out
          
          TARGET_DEFCONFIG=""
          for cfg in "vendor/holi-perf_defconfig" "vendor/bangkk_defconfig" "holi-perf_defconfig" "bangkk_defconfig"; do
            if [ -f "arch/arm64/configs/$cfg" ]; then
              TARGET_DEFCONFIG="$cfg"
              break
            fi
          done

          if [ -z "$TARGET_DEFCONFIG" ]; then
            TARGET_DEFCONFIG=$(find arch/arm64/configs/ -name "*defconfig" | head -n 1 | sed 's|arch/arm64/configs/||')
          fi

          echo "Usando defconfig: $TARGET_DEFCONFIG"

          # Remove do defconfig a chamada das funções proprietárias do IOMMU que causam erro no linker
          DEFCONFIG_PATH="arch/arm64/configs/$TARGET_DEFCONFIG"
          sed -i '/CONFIG_QCOM_IO_PGTABLE_FAST/d' $DEFCONFIG_PATH || true
          echo "CONFIG_QCOM_IO_PGTABLE_FAST=n" >> $DEFCONFIG_PATH

          make O=out ARCH=arm64 $TARGET_DEFCONFIG

          # Ajustes KernelSU
          scripts/config --file out/.config -e KSU
          scripts/config --file out/.config -e OVERLAY_FS
          scripts/config --file out/.config -d KPROBES
          scripts/config --file out/.config -d HAVE_KPROBES

          # Desativa explicitamente o fast io-pgtable no .config final
          scripts/config --file out/.config -d QCOM_IO_PGTABLE_FAST

          make -j$(nproc) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- KCFLAGS="-Wno-error" olddefconfig
          make -j$(nproc) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- KCFLAGS="-Wno-error" Image.gz
          make -j$(nproc) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- KCFLAGS="-Wno-error" dtbs || true

          if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            find out/arch/arm64/boot/dts/ -name "*.dtb" -exec cat {} + > out/arch/arm64/boot/dtb || touch out/arch/arm64/boot/dtb
            cat out/arch/arm64/boot/Image.gz out/arch/arm64/boot/dtb > out/arch/arm64/boot/Image.gz-dtb
          fi

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          rm -rf AnyKernel3/.git
          cp kernel_src/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          
          cd AnyKernel3
          sed -i 's/block=auto/block=\/dev\/block\/bootdevice\/by-name\/boot/g' anykernel.sh
          sed -i 's/is_slot_device=auto/is_slot_device=1/g' anykernel.sh
          zip -r9 ../MotoG84-KernelSU-Next.zip * -x README.md

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MotoG84-KernelSU-Next-Flashable
          path: MotoG84-KernelSU-Next.zip
