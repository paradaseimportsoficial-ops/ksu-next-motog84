name: Build KernelSU Next (Legacy 5.4 Fix) - Moto G84

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev git zip llvm clang libelf-dev curl wget gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 python3-pip

      - name: Clone Motorola Kernel Source
        run: |
          git clone --depth=1 https://github.com/MotorolaMobilityLLC/kernel-msm.git -b android-14 kernel_src || git clone --depth=1 https://github.com/MotorolaMobilityLLC/kernel-msm.git kernel_src

      - name: Setup KernelSU Next Driver
        run: |
          cd kernel_src
          # Clona o repositório do KernelSU-Next direto na pasta correta
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git drivers/kernelsu

          # Injeta as referencias no Kconfig e Makefile principais do kernel
          if ! grep -q "drivers/kernelsu" drivers/Kconfig; then
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          fi
          if ! grep -q "drivers/kernelsu" drivers/Makefile; then
            echo 'obj-y += kernelsu/' >> drivers/Makefile
          fi

      - name: Apply Manual Hooks (Legacy Kernel Patch)
        run: |
          cd kernel_src
          # Aplica os ganchos manuais nas syscalls de execve e openat para kernels 5.4
          if ! grep -q "ksu_handle_execve" fs/exec.c; then
            sed -i '/setup_new_exec(bprm);/a \	extern int ksu_handle_execve(struct filename **filename_ptr); ksu_handle_execve(&bprm->filename);' fs/exec.c
          fi
          if ! grep -q "ksu_handle_faccessat" fs/open.c; then
            sed -i '/SYSCALL_DEFINE3(faccessat/a \	extern int ksu_handle_faccessat(int *dfd, const char __user **filename_ptr, int *mode, int *flags); ksu_handle_faccessat(&dfd, &filename, &mode, &flags);' fs/open.c
          fi

      - name: Build Kernel Image & DTB
        run: |
          cd kernel_src
          mkdir -p out
          
          # Seleciona a defconfig do Snapdragon 695 (Holi)
          if [ -f "arch/arm64/configs/vendor/holi-perf_defconfig" ]; then
            DEFCONFIG="vendor/holi-perf_defconfig"
          elif [ -f "arch/arm64/configs/holi-perf_defconfig" ]; then
            DEFCONFIG="holi-perf_defconfig"
          else
            DEFCONFIG="gki_defconfig"
          fi

          make O=out ARCH=arm64 $DEFCONFIG

          # Ativa o KSU estatico e desativa KPROBES
          scripts/config --file out/.config -e KSU
          scripts/config --file out/.config -e OVERLAY_FS
          scripts/config --file out/.config -d KPROBES
          scripts/config --file out/.config -d HAVE_KPROBES
          
          make -j$(nproc) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- KCFLAGS="-Wno-error=implicit-function-declaration -Wno-error -Wno-fatal-warnings" olddefconfig
          make -j$(nproc) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- KCFLAGS="-Wno-error=implicit-function-declaration -Wno-error -Wno-fatal-warnings" Image.gz dtbs

          # Concatena a arvore de dispositivos (DTB) com o kernel comprimido
          find out/arch/arm64/boot/dts/ -name "*.dtb" -exec cat {} + > out/arch/arm64/boot/dtb
          cat out/arch/arm64/boot/Image.gz out/arch/arm64/boot/dtb > out/arch/arm64/boot/Image.gz-dtb

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          rm -rf AnyKernel3/.git
          cp kernel_src/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          
          # Ajusta parâmetros do AnyKernel3 para a partição do Moto G84
          cd AnyKernel3
          sed -i 's/block=auto/block=\/dev\/block\/bootdevice\/by-name\/boot/g' anykernel.sh
          sed -i 's/is_slot_device=auto/is_slot_device=1/g' anykernel.sh
          zip -r9 ../MotoG84-KernelSU-Next.zip * -x .git README.md

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MotoG84-KernelSU-Next-Flashable
          path: MotoG84-KernelSU-Next.zip
