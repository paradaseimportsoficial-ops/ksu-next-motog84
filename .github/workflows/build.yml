name: Build KernelSU Next - Moto G84

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev git zip llvm clang libelf-dev

      - name: Clone Motorola Kernel Source
        run: |
          git clone --depth=1 https://github.com/MotorolaMobilityLLC/kernel-msm.git kernel_src

      - name: Integrate KernelSU Next via Git
        run: |
          cd kernel_src
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          cd KernelSU-Next
          bash kernel/setup.sh next
          cd ..

      - name: Generate Defconfig & Build Kernel
        run: |
          cd kernel_src
          export ARCH=arm64
          export SUBARCH=arm64
          
          if [ -f "arch/arm64/configs/vendor/holi_defconfig" ]; then
            make O=out vendor/holi_defconfig
          elif [ -f "arch/arm64/configs/vendor/sm6375_defconfig" ]; then
            make O=out vendor/sm6375_defconfig
          elif [ -f "arch/arm64/configs/vendor/bangkk_defconfig" ]; then
            make O=out vendor/bangkk_defconfig
          else
            make O=out defconfig
          fi

          make -j$(nproc) O=out

      - name: Upload boot.img Artifact
        uses: actions/upload-artifact@v3
        with:
          name: MotoG84-KernelSU-Next
          path: kernel_src/out/arch/arm64/boot/boot.img
