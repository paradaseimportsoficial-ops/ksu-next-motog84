name: Build KernelSU Next - Moto G84

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev git zip llvm clang libelf-dev curl

      - name: Clone Motorola Kernel Source
        run: |
          git clone --depth=1 https://github.com/MotorolaMobilityLLC/kernel-msm.git kernel_src

      - name: Setup KernelSU Next Driver
        run: |
          cd kernel_src
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash - || true
          if [ ! -d "drivers/kernelsu" ]; then
            git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git KSU_TEMP
            mkdir -p drivers/kernelsu
            cp -r KSU_TEMP/kernel/* drivers/kernelsu/
            rm -rf KSU_TEMP
            echo "obj-y += kernelsu/" >> drivers/Makefile
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          fi

      - name: Generate Defconfig & Build Kernel
        run: |
          cd kernel_src
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Procura a defconfig correta no repositorio
          if [ -f "arch/arm64/configs/vendor/holi_defconfig" ]; then
            make O=out vendor/holi_defconfig
          elif [ -f "arch/arm64/configs/vendor/sm6375_defconfig" ]; then
            make O=out vendor/sm6375_defconfig
          elif [ -f "arch/arm64/configs/vendor/bangkk_defconfig" ]; then
            make O=out vendor/bangkk_defconfig
          else
            make O=out defconfig
          fi

          echo "CONFIG_KSU=y" >> out/.config
          make -j$(nproc) O=out

      - name: Upload boot.img Artifact
        uses: actions/upload-artifact@v3
        with:
          name: MotoG84-KernelSU-Next
          path: kernel_src/out/arch/arm64/boot/boot.img
