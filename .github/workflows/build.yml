name: Build KernelSU Next (Legacy 5.4 Fix) - Moto G84

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev git zip llvm clang libelf-dev curl gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 python3-pip

      - name: Clone Motorola Kernel Source
        run: |
          git clone --depth=1 https://github.com/MotorolaMobilityLLC/kernel-msm.git -b android-14 kernel_src || git clone --depth=1 https://github.com/MotorolaMobilityLLC/kernel-msm.git kernel_src

      - name: Setup KernelSU Next Driver
        run: |
          cd kernel_src
          # Clona o repositório do KernelSU-Next diretamente
          git clone --depth=1 https://github.com/tbrand/KernelSU-Next.git KernelSU-Next
          
          # Copia/linka os drivers para o kernel local
          cd KernelSU-Next
          bash setup.sh next || bash setup.sh

      - name: Build Kernel Image
        run: |
          cd kernel_src
          mkdir -p out
          
          # Aplica a defconfig do Snapdragon 695 / Holi (Moto G84)
          if [ -f "arch/arm64/configs/vendor/holi-perf_defconfig" ]; then
            make O=out ARCH=arm64 vendor/holi-perf_defconfig
          elif [ -f "arch/arm64/configs/holi-perf_defconfig" ]; then
            make O=out ARCH=arm64 holi-perf_defconfig
          else
            make O=out ARCH=arm64 gki_defconfig
          fi

          # Configurações do KernelSU
          scripts/config --file out/.config -e KSU
          scripts/config --file out/.config -e OVERLAY_FS
          scripts/config --file out/.config -e KPROBES
          scripts/config --file out/.config -e HAVE_KPROBES
          
          make -j$(nproc) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- KCFLAGS="-Wno-error=implicit-function-declaration -Wno-error" olddefconfig
          make -j$(nproc) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- KCFLAGS="-Wno-error=implicit-function-declaration -Wno-error" Image.gz dtbs

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MotoG84-KernelSU-Kernel
          path: |
            kernel_src/out/arch/arm64/boot/Image.gz
