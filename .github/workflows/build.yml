      - name: Empacotar em ZIP usando AnyKernel3
        run: |
          # Baixa o AnyKernel3 genérico
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          rm -rf anykernel/.git anykernel/README.md
          
          # Copia a imagem do kernel compilada para dentro do AnyKernel3
          KERNEL_IMG=$(find android-kernel/out/arch/arm64/boot/ -name "Image.gz-dtb" -o -name "Image.gz" | head -n 1)
          if [ -n "$KERNEL_IMG" ]; then
              cp "$KERNEL_IMG" anykernel/Image.gz-dtb
              echo "Kernel copiado com sucesso para o AnyKernel3!"
          else
              echo "ERRO: Imagem do kernel não encontrada!"
              exit 1
          fi
          
          # Configura o AnyKernel para o Moto G84 com o bloco de boot correto
          cd anykernel
          if [ -f "anykernel.sh" ]; then
              sed -i 's/device\.name1=.*/device.name1=bangkk/g' anykernel.sh
              sed -i 's/device\.name2=.*/device.name2=bangkk/g' anykernel.sh
              sed -i 's/block=.*/block=\/dev\/block\/by-name\/boot/g' anykernel.sh
              sed -i 's/is_slot_device=.*/is_slot_device=auto/g' anykernel.sh
              sed -i 's/ramdisk_compression=.*/ramdisk_compression=auto/g' anykernel.sh
          fi
          
          # Cria o arquivo ZIP final
          zip -r9 ../MotoG84_Custom_Kernel_AnyKernel3.zip *
          
