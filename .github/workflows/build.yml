name: Build KernelSU Next do Zero para Moto G84 5G

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente e ferramentas de compilação
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev python3-pip lz4 pigz git ccache libncurses5-dev
          pip3 install gdown

      - name: Baixar Toolchain (Clang/LLVM do Android)
        run: |
          mkdir -p toolchain
          cd toolchain
          git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 --depth=1 -b master-kernel-build-2022 clang-standalone
          cd ..

      - name: Baixar código-fonte do Kernel oficial da Motorola (Moto G84)
        run: |
          # Clona a fonte do kernel msm sem travar em nome de branch antiga
          git clone https://github.com/MotorolaMobilityLLC/kernel-msm.git --depth=1 android-kernel

      - name: Integrar KernelSU Next no código-fonte
        run: |
          cd android-kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: Configurar Swap de 12GB para evitar falta de memória
        run: |
          sudo swapoff /swapfile || true
          sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Compilar Kernel do Moto G84 5G
        run: |
          cd android-kernel
          
          # Remove o sufixo -dirty do Git
          touch .scmversion
          
          # Configura os caminhos do compilador Clang
          export PATH="$(pwd)/../toolchain/clang-standalone/clang-r450784d/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export LLVM=1
          export LLVM_IAS=1
          export LOCALVERSION=-tecnico-root-v1

          # Tenta carregar a configuração defconfig correta do Moto G84
          make O=out vendor/penangf_defconfig || make O=out vendor/bangkk_defconfig || make O=out vendor/penang_defconfig
          
          # Executa a compilação do Kernel
          make -j$(nproc --all) O=out

      - name: Processar e Reempacotar com Magiskboot
        run: |
          mkdir -p work
          cd work

          # 1. Baixar o boot.img da ROM Stomo do Google Drive
          gdown "https://drive.google.com/uc?id=1rJ1xb5ZgOAYiMTMa86LzMSpRUk44-D5_" -O boot_stock.img

          # 2. Extrair magiskboot do APK do Magisk
          curl -L -o magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v26.1/Magisk-v26.1.apk
          unzip -q magisk.apk
          cp lib/x86_64/libmagiskboot.so ./magiskboot
          chmod +x magiskboot

          # 3. Descompactar o boot.img original
          ./magiskboot unpack boot_stock.img

          # 4. Localizar a imagem compilada
          COMPILED_IMAGE=$(find ../android-kernel/out/arch/arm64/boot -name "Image.gz" -o -name "Image" | head -n 1)
          echo "Kernel compilado encontrado em: $COMPILED_IMAGE"

          # 5. Identificar o formato do kernel original e substituir
          KERNEL_FMT=$(file kernel | grep -o -E 'LZ4|gzip|raw' || echo "raw")
          echo "Formato detectado do kernel original: $KERNEL_FMT"

          if [[ "$KERNEL_FMT" == *"LZ4"* ]]; then
             lz4 -c -12 "$COMPILED_IMAGE" > kernel
          elif [[ "$KERNEL_FMT" == *"gzip"* ]]; then
             gzip -c -9 "$COMPILED_IMAGE" > kernel
          else
             cp "$COMPILED_IMAGE" kernel
          fi

          # 6. Reempacotar o boot.img final
          ./magiskboot repack boot_stock.img boot_finished.img
          cp boot_finished.img ../boot_finished.img

      - name: Anexar Artefato (boot.img Final Compilado)
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU_Next_Moto_G84_5G_Compiled
          path: boot_finished.img
          
