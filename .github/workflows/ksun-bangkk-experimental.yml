name: Moto G84 - KernelSU Next experimental

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ksun-bangkk-experimental.yml'

permissions:
  contents: read

concurrency:
  group: bangkk-ksun-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      KERNEL_SHA: 9b862eda32365382ce5beebc8e616db1507eed1e
      KSU_SHA: b933b1f728116a456fbebf27b6a8772a640cdf23
      CLANG_SHA: 7e2d7f3e8dba20760df041bf90ca5a15913631c8
      ARCH: arm64
      LLVM: '1'
      LLVM_IAS: '1'
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_COMPAT: arm-linux-gnueabi-
      CLANG_TRIPLE: aarch64-linux-gnu-
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            libncurses5 libncurses-dev python3 rsync curl xz-utils cpio kmod \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
          mkdir -p logs dist toolchain

      - name: Fetch pinned Motorola and KernelSU Next sources
        run: |
          git clone --depth 1 --branch MMI-V1TCS35H.88-16-1 \
            https://github.com/MotorolaMobilityLLC/kernel-msm.git kernel
          test "$(git -C kernel rev-parse HEAD)" = "$KERNEL_SHA"
          git init kernel/KernelSU-Next
          git -C kernel/KernelSU-Next remote add origin https://github.com/KernelSU-Next/KernelSU-Next.git
          git -C kernel/KernelSU-Next fetch --depth 1 origin "$KSU_SHA"
          git -C kernel/KernelSU-Next checkout --detach FETCH_HEAD
          test "$(git -C kernel/KernelSU-Next rev-parse HEAD)" = "$KSU_SHA"
          # Kbuild uses commit history for the manager's version code.
          git -C kernel/KernelSU-Next fetch --unshallow --tags origin
          printf 'Motorola tag: MMI-V1TCS35H.88-16-1\nKernel: %s\nKernelSU Next legacy: %s\nClang repository: %s\n' \
            "$KERNEL_SHA" "$KSU_SHA" "$CLANG_SHA" > logs/sources.txt

      - name: Download original-generation Android Clang 11
        run: |
          curl --fail --location --retry 3 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/$CLANG_SHA/clang-r383902b1.tar.gz" \
            --output clang.tar.gz
          sha256sum clang.tar.gz >> logs/sources.txt
          tar -xzf clang.tar.gz -C toolchain
          rm clang.tar.gz
          "$PWD/toolchain/bin/clang" --version | tee logs/compiler.txt
          echo "$PWD/toolchain/bin" >> "$GITHUB_PATH"

      - name: Integrate built-in KernelSU Next and configure bangkk
        run: |
          cd kernel
          ln -s ../KernelSU-Next/kernel drivers/kernelsu
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          printf '\nsource "drivers/kernelsu/Kconfig"\n' >> drivers/Kconfig
          mkdir -p out
          # Same fragment order as Motorola's holi-qgki user configuration generator.
          bash scripts/gki/fragment_allyesconfig.sh \
            arch/arm64/configs/vendor/holi_GKI.config out/holi_allyes.config
          bash scripts/kconfig/merge_config.sh -m -O out \
            arch/arm64/configs/gki_defconfig \
            out/holi_allyes.config \
            arch/arm64/configs/vendor/holi_QGKI.config \
            arch/arm64/configs/vendor/debugfs.config \
            arch/arm64/configs/vendor/ext_config/moto-holi.config \
            arch/arm64/configs/vendor/ext_config/moto-holi-bangkk.config \
            2>&1 | tee ../logs/config-merge.log
          scripts/config --file out/.config \
            -e KSU -d KSU_MANUAL_HOOK -d KSU_KPROBES_HOOK -e KSU_SYSCALL_TABLE_HOOK \
            -e KALLSYMS -e KALLSYMS_ALL -e IKCONFIG -e IKCONFIG_PROC \
            -e HEADERS_INSTALL --set-str LOCALVERSION '-Tecnico-Root-KSUN-test' -d LOCALVERSION_AUTO
          make O=out olddefconfig 2>&1 | tee ../logs/config.log
          for setting in CONFIG_KSU=y CONFIG_KSU_SYSCALL_TABLE_HOOK=y CONFIG_BANGKK_DTB=y CONFIG_EXT4_FS=y; do
            grep -qx "$setting" out/.config || { echo "Missing required setting: $setting"; exit 1; }
          done
          cp out/.config ../logs/kernel.config
          make -s O=out kernelrelease | tee ../logs/kernelrelease.txt
          grep -q '^5\.4\.284-' ../logs/kernelrelease.txt

      - name: Compile KernelSU driver first
        run: |
          cd kernel
          make O=out headers_install 2>&1 | tee ../logs/headers.log
          make -j2 O=out drivers/kernelsu/ 2>&1 | tee ../logs/ksun-build.log

      - name: Compile kernel image and in-tree modules
        run: |
          cd kernel
          make -j2 O=out Image modules 2>&1 | tee ../logs/kernel-build.log
          test -s out/arch/arm64/boot/Image
          test -s out/vmlinux
          llvm-nm out/vmlinux > ../logs/symbols.txt
          grep -q ' ksu_' ../logs/symbols.txt
          cp out/arch/arm64/boot/Image ../dist/Image
          cp out/Module.symvers ../dist/
          make O=out INSTALL_MOD_PATH="$GITHUB_WORKSPACE/dist/modules" modules_install \
            2>&1 | tee ../logs/modules-install.log
          cp ../logs/kernel.config ../logs/sources.txt ../logs/kernelrelease.txt ../dist/
          git diff --binary > ../dist/kernel-integration.patch
          git -C KernelSU-Next diff --binary > ../dist/ksun-build-adjustments.patch
          printf '%s\n' \
            'EXPERIMENTAL - Moto G84 bangkk, Motorola MMI-V1TCS35H.88-16-1 / Linux 5.4.284.' \
            'This is a compilation artifact, NOT a flashable boot.img or TWRP installer.' \
            'KernelSU Next uses pinned official legacy sources, not the v3.4.2 GKI binaries.' \
            'Boot, vendor modules, device trees and manager compatibility have not been tested on hardware.' \
            'Do not downgrade or flash this archive. Packaging requires matching firmware and module validation.' \
            > ../dist/READ-ME.txt
          cd ../dist
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Upload compilation artifact
        uses: actions/upload-artifact@v4
        with:
          name: bangkk-5.4.284-ksun-EXPERIMENTAL-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p logs
          if [ -f kernel/out/.config ]; then cp kernel/out/.config logs/kernel.config; fi
          if [ -d kernel/.git ]; then git -C kernel diff --stat > logs/source-changes.txt; fi

      - name: Upload logs even if compilation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bangkk-build-logs-${{ github.run_number }}
          path: logs/
          retention-days: 14
