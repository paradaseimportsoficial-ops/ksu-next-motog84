name: Package verified Moto G84 build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/package-bangkk.yml'

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Download successful build 41270487801
        uses: actions/download-artifact@v4
        with:
          name: bangkk-5.4.284-ksun-EXPERIMENTAL-2
          run-id: 41270487801
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: original

      - name: Verify and package only files in original SHA256SUMS
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, shutil, zipfile
          root = pathlib.Path('original').resolve()
          manifest = root / 'SHA256SUMS'
          assert manifest.is_file(), 'Missing original checksums'
          entries = []
          names = set()
          for line in manifest.read_text().splitlines():
              digest, name = line.split('  ', 1)
              name = name.removeprefix('./')
              parts = pathlib.PurePosixPath(name)
              assert not parts.is_absolute() and '..' not in parts.parts, name
              assert name not in names, 'Duplicate manifest entry'
              assert len(digest) == 64 and all(c in '0123456789abcdef' for c in digest)
              names.add(name)
              p = root / name
              assert p.is_file() and not p.is_symlink(), name
              assert root in p.resolve().parents, name
              with p.open('rb') as f:
                  actual = hashlib.file_digest(f, 'sha256').hexdigest() if hasattr(hashlib, 'file_digest') else None
              if actual is None:
                  h = hashlib.sha256()
                  with p.open('rb') as f:
                      for block in iter(lambda: f.read(1048576), b''): h.update(block)
                  actual = h.hexdigest()
              assert actual == digest, f'Checksum mismatch: {name}'
              entries.append((name, p))
          required = {'Image', 'Module.symvers', 'kernel.config', 'sources.txt', 'kernelrelease.txt', 'READ-ME.txt'}
          assert required <= names, 'Missing required build outputs'
          assert not any('/build/' in n or '/source/' in n for n in names)
          out = pathlib.Path('compact')
          out.mkdir()
          dest = out / 'MotoG84-5.4.284-KernelSU-Next-COMPILE-ONLY.zip'
          with zipfile.ZipFile(dest, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for name, p in entries: z.write(p, name)
              z.write(manifest, 'SHA256SUMS')
          h = hashlib.sha256()
          with dest.open('rb') as f:
              for block in iter(lambda: f.read(1048576), b''): h.update(block)
          (out / 'SHA256SUMS.txt').write_text(f'{h.hexdigest()}  {dest.name}\n')
          print(f'Verified {len(entries)} files. Compact ZIP: {dest.stat().st_size} bytes.')
          print((root / 'kernelrelease.txt').read_text())
          print((root / 'sources.txt').read_text())
          for name in ['Image', 'Module.symvers', 'kernel.config', 'kernelrelease.txt']:
              print(f'{name}: {(root/name).stat().st_size} bytes')
          print('Not a flashable ZIP; firmware and module compatibility still need validation.')
          PY

      - name: Upload compact verified build
        uses: actions/upload-artifact@v4
        with:
          name: MotoG84-KSUN-compact-verified
          path: compact/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
